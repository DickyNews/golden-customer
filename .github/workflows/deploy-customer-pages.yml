name: Deploy Customer Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "analytics-config.js"
      - "functions/**"
      - ".github/workflows/deploy-customer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare static site
        run: |
          set -eu
          mkdir -p dist
          cp index.html dist/
          cp analytics-config.js dist/

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create golden-customer --production-branch main || {
            echo "Project creation did not complete; checking deployment next."
          }

      - name: Deploy customer website and API proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=golden-customer --branch=main
